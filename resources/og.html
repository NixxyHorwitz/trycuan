<!doctype html>
<meta charset="utf-8">
<!-- Sumber public/assets/og.png dan ikon. Potret dengan browser pada 1200x630 (#og) atau 512x512 (#icon). -->
<style>
@font-face { font-family: P; font-weight: 700; src: url(../public/assets/build/font-poppins-latin-700-normal.woff2); }
@font-face { font-family: P; font-weight: 500; src: url(../public/assets/build/font-poppins-latin-500-normal.woff2); }
* { margin: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; font-family: P; color: #fff; background: radial-gradient(circle at 92% 105%, #f26a1b 0, transparent 46%), linear-gradient(125deg, #1b1512 40%, #3a1a0a); }
.og { padding: 72px 80px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 20px; font-weight: 700; font-size: 38px; }
.mark { width: 68px; height: 68px; border-radius: 20px; background: #f26a1b; display: grid; place-items: center; }
h1 { font-size: 84px; line-height: 1.05; letter-spacing: -.035em; max-width: 900px; }
p { font-weight: 500; font-size: 30px; color: #cfc4bd; }
svg { width: 60%; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.icon { display: none; width: 100%; height: 100%; background: #d04409; place-items: center; }
body:has(#icon:target) .og { display: none; }
body:has(#icon:target) .icon { display: grid; }
</style>
